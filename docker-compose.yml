# Stack Big Data de prévision météo J+1.
#   docker compose up -d --build                       # socle : lake, Spark, MLflow, Airflow, serving
#   docker compose --profile streaming up -d           # + Kafka, producteur de rejeu, Spark Streaming
#   docker compose run --rm jobs python -m meteo.jobs.<job>   # lancer un job à la main

name: meteo

x-meteo-env: &meteo-env
  API_BASE_URL: ${API_BASE_URL:-https://climato.chom.engineering}
  HISTORY_START: ${HISTORY_START:-1990-01-01}
  MAX_STATIONS: ${MAX_STATIONS:-0}
  API_WORKERS: ${API_WORKERS:-3}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  SPARK_MASTER: spark://spark-master:7077
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
  SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1536m}
  KAFKA_BOOTSTRAP: kafka:9092
  METEO_PG_DSN: postgresql://meteo:meteo@postgres:5432/meteo
  MLFLOW_TRACKING_URI: http://mlflow:5000
  GBT_MAX_ITER: ${GBT_MAX_ITER:-40}
  GBT_MAX_DEPTH: ${GBT_MAX_DEPTH:-6}
  TRAIN_SAMPLE: ${TRAIN_SAMPLE:-1.0}
  SPARK_CORES_MAX: ${SPARK_CORES_MAX:-3}

networks:
  default:
    name: meteo_net

volumes:
  minio-data:
  postgres-data:
  kafka-data:
  airflow-logs:

services:
  # ---------------------------------------------------------------- stockage
  minio:
    image: pgsty/minio:latest   # fork maintenu de MinIO (l'image officielle n'est plus publiée sur Docker Hub)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  # Crée les buckets et le schéma de serving, puis s'arrête
  lake-init:
    image: meteo-spark:latest
    environment: *meteo-env
    command: ["python", "-m", "meteo.jobs.init_lake"]
    depends_on:
      minio: {condition: service_started}
      postgres: {condition: service_healthy}
    restart: on-failure

  # ---------------------------------------------------------------- calcul
  spark-master:
    image: meteo-spark:latest
    build: {context: ., dockerfile: docker/spark/Dockerfile}
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["8081:8080", "7077:7077"]

  spark-worker:
    image: meteo-spark:latest
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      <<: *meteo-env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    depends_on: [spark-master]
    ports: ["8082:8081"]

  # Conteneur « client » pour lancer les jobs à la main (docker compose run --rm jobs ...)
  jobs:
    image: meteo-spark:latest
    environment: *meteo-env
    profiles: [manual]
    volumes: ["./src:/app/src:ro", "./tests:/app/tests:ro"]   # le code local est pris sans rebuild
    depends_on: [spark-master, minio, postgres]

  # ---------------------------------------------------------------- ML
  mlflow:
    build: {context: docker/mlflow}
    image: meteo-mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination s3://mlflow --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports: ["5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      lake-init: {condition: service_completed_successfully}

  # ---------------------------------------------------------------- orchestration
  # Airflow lance chaque étape dans un conteneur meteo-spark (DockerOperator), via un proxy
  # du socket Docker qui n'expose que les appels nécessaires.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment: {CONTAINERS: 1, IMAGES: 1, NETWORKS: 1, POST: 1, INFO: 1}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  airflow:
    image: apache/airflow:2.10.5-python3.10
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__WORKERS: 2
      METEO_DOCKER_URL: tcp://docker-proxy:2375
      METEO_IMAGE: meteo-spark:latest
      METEO_NETWORK: meteo_net
      # Variables transmises aux conteneurs de jobs
      <<: *meteo-env
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Admin --lastname Meteo --role Admin --email admin@example.com || true;
      airflow scheduler & exec airflow webserver"
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      docker-proxy: {condition: service_started}

  # ---------------------------------------------------------------- serving
  api:
    build: {context: serving/api}
    image: meteo-api:latest
    environment:
      METEO_PG_DSN: postgresql://meteo:meteo@postgres:5432/meteo
    ports: ["8000:8000"]
    depends_on:
      lake-init: {condition: service_completed_successfully}

  dashboard:
    build: {context: serving/dashboard}
    image: meteo-dashboard:latest
    environment:
      METEO_PG_DSN: postgresql://meteo:meteo@postgres:5432/meteo
    ports: ["8501:8501"]
    depends_on:
      lake-init: {condition: service_completed_successfully}

  # ---------------------------------------------------------------- streaming (profil)
  kafka:
    image: apache/kafka:3.8.1
    profiles: [streaming]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["29092:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]

  streaming:
    image: meteo-spark:latest
    profiles: [streaming]
    environment:
      <<: *meteo-env
      STREAM_STARTING_OFFSETS: earliest
      # le streaming tourne en continu : on lui réserve une petite part du worker (1 cœur, 512 Mo),
      # le reste (3 cœurs, 1,5 Go) reste disponible pour les jobs batch lancés par Airflow
      SPARK_CORES_MAX: 1
      SPARK_EXECUTOR_MEMORY: 512m
    command: ["python", "-m", "meteo.jobs.streaming_forecast"]
    depends_on: [kafka, spark-worker]
    restart: on-failure

  producer:
    image: meteo-spark:latest
    profiles: [streaming]
    environment: *meteo-env
    command: ["python", "-m", "meteo.jobs.replay_producer", "--mode", "replay",
              "--start", "${REPLAY_START:-2025-06-01}", "--end", "${REPLAY_END:-2025-09-01}",
              "--secondes-par-jour", "${REPLAY_SECONDS_PER_DAY:-5}"]
    depends_on: [kafka]
